name: Universal Recycle CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
        exclude:
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: CLI smoke (installed entry points)
        run: |
          recycle list
          recycle --help

      - name: Validate repos.yaml via loader
        run: |
          python -c "from recycle.cli import load_manifest; r=load_manifest('repos.yaml'); print(f'Loaded {len(r)} repositories')"

      - name: Adapter dry run
        run: |
          python -c "
          import os, tempfile
          from recycle.plugin import run_adapters
          with tempfile.TemporaryDirectory() as d:
              with open(os.path.join(d, 'test.py'), 'w') as f:
                  f.write('print(\"Hello\")\n')
              repo = {'name': 'test-repo', 'language': 'python'}
              results = run_adapters(repo, d, ['ruff', 'mypy'])
              print('Adapter results:', results)
          "

  lint:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check recycle/ tests/
          ruff format --check recycle/ tests/

      - name: Mypy
        run: mypy recycle/

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  documentation:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README sections
        run: |
          test -f README.md
          grep -qE '^## Getting Started' README.md
          grep -qE '^## Current Status' README.md
          grep -qE '^## Quick Start' README.md
          echo "README.md validation passed"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package for manifest checks
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Validate YAML manifests and workflow
        run: |
          python -c "
          import yaml
          from pathlib import Path
          from recycle.cli import load_manifest
          load_manifest('repos.yaml')
          load_manifest(str(Path('tests/fixtures/minimal-manifest.yaml')))
          with open('.github/workflows/ci.yml') as f:
              yaml.safe_load(f)
          print('YAML validation passed')
          "

  audit:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip-audit
